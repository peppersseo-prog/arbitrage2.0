name: Build Windows EXE

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --clean --name ArbitrageClient main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ArbitrageClient-Windows
          path: dist/ArbitrageClient.exe
